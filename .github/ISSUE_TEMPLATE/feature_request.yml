name: Feature request
description: Suggest an improvement for EXEscript
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Describe the problem or workflow you want to improve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested behavior
      description: Describe how you think the feature should work.
    validations:
      required: true
