name: Bug report
description: Report a reproducible EXEscript problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not include secrets, credentials, or private scripts.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Target architecture
      options:
        - x64
        - x86
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Application mode
      options:
        - Windowed
        - Console
        - Minimize to tray
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: PowerShell runtime
      options:
        - Windows PowerShell 5.1
        - PowerShell 7+
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Tell us exactly what you did and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
